# ─────────────────────────────────────────────────────────────────────
# Dev stack — LibreChat v0.8.4 + dependencies + office-mcp.
# Use it to test the full integration locally:
#   1. cp .env.example .env  &&  fill CREDS_KEY / CREDS_IV / JWT_*
#   2. docker compose -f docker-compose.yml -f docker-compose.librechat.yml up
#   3. Open http://localhost:3080
#
# In production, copy librechat.yaml.example into your real LibreChat
# project and reuse `docker-compose.librechat.override.yml.example` instead.
# ─────────────────────────────────────────────────────────────────────

services:
  mongodb:
    image: mongo:7.0
    container_name: office-mcp-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - office-mcp
    command: mongod --noauth

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    container_name: office-mcp-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    networks:
      - office-mcp

  librechat:
    image: ghcr.io/danny-avila/librechat:${LIBRECHAT_VERSION:-v0.8.4}
    container_name: librechat
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
      - office-mcp
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - OFFICE_MCP_TOKEN=${OFFICE_MCP_TOKEN}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # MiniMax custom endpoint (read by librechat.yaml ${...} placeholders)
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      # OIDC SSO (Azure AD) — uses the same app registration as office-mcp.
      # Setting ALLOW_SOCIAL_LOGIN=true unlocks the "Continuer avec Microsoft"
      # button on the login screen; ALLOW_REGISTRATION above is OFF so users
      # cannot create local accounts and must enter via SSO.
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-true}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-true}
      - OPENID_CLIENT_ID=${OPENID_CLIENT_ID}
      - OPENID_CLIENT_SECRET=${OPENID_CLIENT_SECRET}
      - OPENID_ISSUER=${OPENID_ISSUER}
      - OPENID_SESSION_SECRET=${OPENID_SESSION_SECRET}
      - OPENID_SCOPE=${OPENID_SCOPE:-openid profile email}
      - OPENID_CALLBACK_URL=${OPENID_CALLBACK_URL:-/oauth/openid/callback}
      - OPENID_BUTTON_LABEL=${OPENID_BUTTON_LABEL:-Continuer avec Microsoft}
    volumes:
      - ./librechat.yaml.example:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
    networks:
      - office-mcp

volumes:
  mongodb-data:
  meili-data:
  librechat-images:
  librechat-uploads:
