# ─────────────────────────────────────────────────────────────────────
# Staging override — second LibreChat instance pinned to v0.8.6-rc1
# to validate the "Rich File Artifact Previews" pipeline (PR #12934)
# against our office-mcp without disturbing the production stack.
#
# Coexists with the prod `librechat` service: same office-mcp, same
# MongoDB/Meilisearch (separate DBs/indexes), separate volumes, port
# 3081 on the host, Traefik route `librechat-staging.reho.dev`.
#
# Append to the compose command:
#   docker compose -f deployment/compose/docker-compose.yml \
#                  -f deployment/compose/docker-compose.librechat.yml \
#                  -f deployment/compose/docker-compose.librechat-staging.yml \
#                  -f deployment/compose/docker-compose.traefik.yml up --build -d
#
# Requires the same prerequisites as the prod stack (Traefik on
# proxy-network, letsencrypt resolver) plus:
#   - DNS for `librechat-staging.reho.dev` pointing to the host
#   - Azure AD redirect URI `https://librechat-staging.reho.dev/oauth/openid/callback`
#     added to the app registration (otherwise SSO fails — fallback is
#     ALLOW_REGISTRATION=true on staging, see below).
# ─────────────────────────────────────────────────────────────────────

services:
  librechat-staging:
    image: ghcr.io/danny-avila/librechat:${LIBRECHAT_STAGING_VERSION:-v0.8.6-rc1}
    container_name: librechat-staging
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
      - office-mcp
      - code-interpreter-staging
    ports:
      - "${LIBRECHAT_STAGING_PORT:-3081}:3080"
    environment:
      - HOST=0.0.0.0
      # Separate Mongo DB so the staging chats/agents do not collide
      # with prod users. Same MongoDB container, different database name.
      - MONGO_URI=mongodb://mongodb:27017/LibreChat-staging
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - OFFICE_MCP_TOKEN=${OFFICE_MCP_TOKEN}
      # Self-hosted Code Interpreter (PR2) — points LibreChat at our
      # custom LibreCodeInterpreter image with office_doctrine preinstalled.
      # Internal-only: resolved over the office-mcp Docker network, no host port.
      - LIBRECHAT_CODE_BASEURL=http://code-interpreter-staging:8000
      - LIBRECHAT_CODE_API_KEY=${CODE_INTERPRETER_KEY}
      # Staging accepts local registration so the PoC tester can sign up
      # without touching the Azure AD app registration. Set to false and
      # rely on SSO once the redirect URI is whitelisted on Azure.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION_STAGING:-true}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-true}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-true}
      - OPENID_CLIENT_ID=${OPENID_CLIENT_ID}
      - OPENID_CLIENT_SECRET=${OPENID_CLIENT_SECRET}
      - OPENID_ISSUER=${OPENID_ISSUER}
      - OPENID_SESSION_SECRET=${OPENID_SESSION_SECRET}
      - OPENID_SCOPE=${OPENID_SCOPE:-openid profile email offline_access Files.ReadWrite}
      - OPENID_REUSE_TOKENS=${OPENID_REUSE_TOKENS:-true}
      - OPENID_CALLBACK_URL=${OPENID_CALLBACK_URL:-/oauth/openid/callback}
      - OPENID_BUTTON_LABEL=${OPENID_BUTTON_LABEL:-Continuer avec Microsoft}
      - DOMAIN_CLIENT=https://librechat-staging.reho.dev
      - DOMAIN_SERVER=https://librechat-staging.reho.dev
    volumes:
      - ../librechat.yaml.example:/app/librechat.yaml:ro
      - librechat-staging-images:/app/client/public/images
      - librechat-staging-uploads:/app/uploads
    networks:
      - office-mcp
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.librechat-staging.rule=Host(`librechat-staging.reho.dev`)"
      - "traefik.http.routers.librechat-staging.entrypoints=websecure"
      - "traefik.http.routers.librechat-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat-staging.loadbalancer.server.port=3080"

  # ─────────────────────────────────────────────────────────────────────
  # Code Interpreter stack (staging only) — PR2 of the pivot to skills.
  # Image is built locally on the pixel runner from docker/code-interpreter/
  # which extends ghcr.io/usnavy13/librecodeinterpreter:main with the
  # office-doctrine wheel (and nothing else).
  #
  # No host port. No Traefik label. Only librechat-staging on the internal
  # `office-mcp` network talks to it. Prod LibreChat and office-mcp are
  # untouched by this section.
  # ─────────────────────────────────────────────────────────────────────
  code-interpreter-staging:
    build:
      context: ../..
      dockerfile: deployment/docker/code-interpreter/Dockerfile
    image: office-code-interpreter:staging
    container_name: code-interpreter-staging
    restart: unless-stopped
    depends_on:
      code-interpreter-redis:
        condition: service_healthy
      code-interpreter-garage:
        condition: service_healthy
    # tini reaps zombie nsjail/python child processes — required by upstream.
    init: true
    # nsjail needs SYS_ADMIN to create namespaces/cgroups, NET_ADMIN to
    # install iptables egress rules. apparmor:unconfined is also required.
    # See https://github.com/usnavy13/LibreCodeInterpreter/blob/main/docker-compose.yml
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
      - /app/data:size=100m
    environment:
      # Single API key for both x-api-key and LibreChat Basic auth paths.
      - API_KEY=${CODE_INTERPRETER_KEY}
      - REDIS_HOST=code-interpreter-redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=code-interpreter-garage:3900
      - S3_ACCESS_KEY=${CODE_INTERPRETER_S3_ACCESS_KEY:-GKminioadmin0000}
      - S3_SECRET_KEY=${CODE_INTERPRETER_S3_SECRET_KEY:-minioadminsecret}
      - S3_BUCKET=code-interpreter-files
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - code-interpreter-sandbox:/var/lib/code-interpreter/sandboxes
      - code-interpreter-skill-deps:/opt/skill-deps
    networks:
      # Internal only. No proxy-network → no Traefik exposure.
      - office-mcp
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  code-interpreter-redis:
    image: redis:7-alpine
    container_name: code-interpreter-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - code-interpreter-redis-data:/data
    networks:
      - office-mcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  code-interpreter-garage:
    image: dxflrs/garage:v2.3.0
    container_name: code-interpreter-garage
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${CODE_INTERPRETER_S3_ACCESS_KEY:-GKminioadmin0000}
      GARAGE_DEFAULT_SECRET_KEY: ${CODE_INTERPRETER_S3_SECRET_KEY:-minioadminsecret}
      GARAGE_DEFAULT_BUCKET: code-interpreter-files
    volumes:
      - code-interpreter-garage-data:/var/lib/garage
      - ../docker/code-interpreter/garage.toml:/etc/garage.toml:ro
    networks:
      - office-mcp
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  librechat-staging-images:
  librechat-staging-uploads:
  code-interpreter-sandbox:
  code-interpreter-skill-deps:
  code-interpreter-redis-data:
  code-interpreter-garage-data:
