# ─────────────────────────────────────────────────────────────────────
# Standalone office-mcp service — useful for dev and CI.
# For end-to-end testing with LibreChat, use:
#   docker compose -f deployment/compose/docker-compose.yml \
#                  -f deployment/compose/docker-compose.librechat.yml up
# Build context is the repo root (../..) so the Dockerfile can COPY
# both ``src/`` and ``packages/``.
# ─────────────────────────────────────────────────────────────────────

services:
  office-mcp:
    build:
      context: ../..
      dockerfile: deployment/docker/mcp-server.Dockerfile
    image: office-mcp:dev
    container_name: office-mcp
    env_file:
      - ../../.env
    ports:
      # Host port 18080 (8080 is often taken on dev/CI runners).
      # Inside the docker network LibreChat still reaches office-mcp on :8080.
      - "18080:8080"
    volumes:
      - office_mcp_data:/data
    restart: unless-stopped
    networks:
      - office-mcp

volumes:
  office_mcp_data:

networks:
  office-mcp:
    name: office-mcp
