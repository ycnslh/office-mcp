[tool.poetry]
name = "office-mcp"
version = "0.1.0"
description = "MCP server to create and edit Word, Excel and PowerPoint documents — designed for LibreChat integration."
authors = ["Yacine S. <yacine@netwatch.fr>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "office_mcp", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^2.14.0"
mcp = { version = "^1.23.0", extras = ["cli"] }
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
structlog = "^24.4.0"
anyio = "^4.6.0"
httpx = "^0.28.1"
starlette = "^0.41.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-httpx = "^0.32.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[tool.poetry.scripts]
office-mcp = "office_mcp.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ──────────────────────────────────────────────────────────────────────
# Tooling
# ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "PTH", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx.*", "openpyxl.*", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
  "integration: tool-level tests with engines",
  "e2e: end-to-end tests against a running MCP server",
]
