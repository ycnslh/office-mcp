[tool.poetry]
name = "office-doctrine"
version = "0.1.0"
description = "Pure bytes-in / bytes-out engines for .docx, .xlsx and .pptx that apply office-mcp's formatting doctrine."
authors = ["Yacine S. <yacine@netwatch.fr>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "office_doctrine", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
