name: CI/CD office-mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les jobs de test tournent sur un runner GitHub (jetable), PAS sur le runner
  # self-hosted : ce depot est public, et pour une PR issue d'un fork GitHub execute
  # la version du workflow qui se trouve dans la PR. Un runner self-hosted
  # laisserait n'importe quel fork executer du code sur l'hote de deploiement.
  # Seul `deploy` utilise le runner self-hosted, et uniquement sur push vers main.

  # ─── Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install + lint + test
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            --env HOME=/tmp \
            --env POETRY_VIRTUALENVS_IN_PROJECT=true \
            --env POETRY_NO_INTERACTION=1 \
            -v ${{ github.workspace }}:/app \
            -w /app \
            python:3.12-slim \
            sh -c "export PATH=/tmp/.local/bin:\$PATH \
              && pip install --quiet --user poetry==1.8.4 \
              && poetry install --with dev --no-ansi \
              && poetry run ruff check . \
              && poetry run pytest -v --tb=short -p no:cacheprovider"

  # ─── Image build verification (every PR + push) ───────────────────────────
  # Catches Dockerfile regressions before they hit main. No registry push :
  # the image is only built to check it, deploy rebuilds its own.
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t office-mcp:ci-${{ github.sha }} .

  # ─── Deploy (main branch only, after tests pass) ──────────────────────────
  # Specific to the upstream maintainer's self-hosted runner. Forks
  # don't have access to the `production` environment / secrets, so
  # this job is gated on the repo owner — it no-ops everywhere else.
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    needs: [test, build-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (github.repository == 'soulkill3r/office-mcp' || github.repository == 'ycnslh/office-mcp')
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env
        run: |
          cat > .env <<EOF
          # office-mcp core
          OFFICE_MCP_HOST=0.0.0.0
          OFFICE_MCP_PORT=8080
          OFFICE_MCP_LOG_LEVEL=INFO
          OFFICE_MCP_TOKEN=${{ secrets.OFFICE_MCP_TOKEN }}
          OFFICE_MCP_LOCAL_ROOT=/data
          OFFICE_MCP_MAX_FILE_SIZE_MB=50
          OFFICE_MCP_RATE_LIMIT_PER_MIN=60
          OFFICE_MCP_SIGNING_SECRET=${{ secrets.OFFICE_MCP_SIGNING_SECRET }}
          OFFICE_MCP_DOWNLOAD_BASE_URL=https://office-mcp.nuitblanche.dev
          OFFICE_MCP_DOWNLOAD_URL_TTL_SECONDS=900
          OFFICE_MCP_PUBLIC_BASE_URL=https://office-mcp.nuitblanche.dev
          OFFICE_MCP_PUBLIC_HOST=office-mcp.nuitblanche.dev

          # Azure AD / Microsoft Graph (delegated OAuth → user OneDrive)
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
          EOF

      - name: Validate required secrets are present
        run: |
          missing=0
          for var in OFFICE_MCP_TOKEN OFFICE_MCP_SIGNING_SECRET AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            val=$(grep "^${var}=" .env | cut -d= -f2-)
            if [ -z "$val" ]; then
              echo "Missing required GitHub secret: ${var}"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1
          echo ".env validated"

      - name: Stop existing office-mcp container
        run: |
          docker stop office-mcp 2>/dev/null || true
          docker rm  office-mcp 2>/dev/null || true

      - name: Build and start office-mcp
        run: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up --build -d

      - name: Wait for office-mcp health
        run: |
          echo "Waiting for office-mcp on host port 18080..."
          for i in $(seq 1 18); do
            if curl -sf "http://localhost:18080/health" > /dev/null; then
              echo "office-mcp healthy (attempt $i)"
              break
            fi
            echo "  attempt $i/18, retrying in 10s..."
            sleep 10
            if [ $i -eq 18 ]; then
              echo "office-mcp did not become healthy within 3 minutes"
              docker compose -f docker-compose.yml -f docker-compose.traefik.yml logs office-mcp
              exit 1
            fi
          done

      - name: Smoke test
        run: |
          curl -sf "http://localhost:18080/health" | grep -q '"status":"ok"' \
            && echo "PASS  office-mcp /health" \
            || { echo "FAIL  office-mcp /health"; exit 1; }

      - name: Container status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.traefik.yml ps
