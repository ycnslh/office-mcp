name: Debug — dump LibreChat logs

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: self-hosted
    steps:
      - name: Container status
        run: docker ps --filter name=librechat --filter name=office-mcp --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Effective librechat.yaml inside the container
        run: |
          echo "── /app/librechat.yaml ─────────────────────────────"
          docker exec librechat sh -c "cat /app/librechat.yaml" || true

      - name: MINIMAX_* env vars seen by LibreChat
        run: |
          docker exec librechat sh -c 'env | grep -i ^MINIMAX | sed "s/\(MINIMAX_API_KEY=\).*/\1<redacted>/"' || true

      - name: LibreChat — last 200 log lines
        run: docker logs librechat --tail 200 2>&1 || true

      - name: office-mcp — last 100 log lines
        run: docker logs office-mcp --tail 100 2>&1 || true

      - name: Probe MiniMax with a sidecar curl on the office-mcp network
        run: |
          KEY=$(docker exec librechat sh -c 'printf %s "$MINIMAX_API_KEY"')
          MODEL=$(docker exec librechat sh -c 'printf %s "$MINIMAX_MODEL"')
          BASE=$(docker exec librechat sh -c 'printf %s "$MINIMAX_BASE_URL"')
          echo "Calling ${BASE}/chat/completions with model=${MODEL}"
          docker run --rm --network office-mcp curlimages/curl:8.10.1 \
            -sS -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
            "${BASE}/chat/completions" \
            | head -c 1500
          echo
